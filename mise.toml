# Инструментарий tessera: openspec CLI закреплён собственной декларацией
# и перекрывает каскад workspace для этого инструмента.
[tools]
"npm:@fission-ai/openspec" = "2.1.1"

# Локальная настройка харнесов контрибьютора: навыки плагина из рабочего дерева
# и зависимости — scripts/setup.sh. Параметры передаются после «--»:
# mise run setup -- --scope user.
[tasks.setup]
description = "Локальная настройка: навыки плагина из рабочего дерева и зависимости — в харнесы контрибьютора"
run = "scripts/setup.sh"
